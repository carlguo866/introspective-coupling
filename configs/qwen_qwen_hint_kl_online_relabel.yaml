# Online relabeling: Hint-MMLU KL config at learning rate 5e-5. Set the share of explanation labels rebuilt from the model's current behavior with train.py --online_relabel_nu <ν>.
target_model_path: Qwen/Qwen3-8B
model_path: Qwen/Qwen3-8B
output_dir: checkpoints/qwen3_8b_hint_kl_online_relabel
cache_dir: null
use_kl_regularization: true
kl_temperature: 1.0
kl_topk: 128
teacher_logits_path: hint_data/mmlu_qwen3_8b_ablation_prompts_ht8_train.jsonl.teacher_logits_top128.pt
train:
  num_samples: 100000000
  batch_size: 8
  save_strategy: steps
  save_total_limit:
  save_steps: 2000
  learning_rate: !!float 5e-5
  weight_decay: !!float 0.01
  lr_scheduler_type: "constant"
  num_epochs: 2
  max_steps: 8000  # the step at which results are reported
  eval_strategy: steps
  eval_steps: 2000
  peft_lora: false
  lora_r: 128
  dataset: ["hint"]
  evaluation_type: mixed
  hint_path: hint_data/mmlu_qwen3_8b_ablation_prompts_ht8_train.jsonl
  intervention_type: hint_ablation
  bf16: true
  tasks:
    causal:
      num_samples: 100000000
      weight: 1.0
      dataset: ["hint"]
      evaluation_type: mixed
      hint_path: hint_data/mmlu_qwen3_8b_ablation_prompts_ht8_train.jsonl
      intervention_type: hint_ablation
      self_consistency: false
      question_types:
        orig_match:
          generate_limit: 1
          evaluation_type: exact_match
          weight: 1.0
          split:
            - train
          prompts:
            - messages:
              - role: "system"
                content: "{system_prompt}"
              - role: "user"
                content: "{user_prompt}"
              - role: "assistant"
                content: "Answer:"
        change_match:
          generate_limit: 1
          evaluation_type: exact_match
          weight: 1.0
          split:
            - train
          prompts:
            - messages:
              - role: "system"
                content: "{system_prompt}"
              - role: "user"
                content: "{user_prompt}"
              - role: "assistant"
                content: "Answer:"
        generative_explanation:
          evaluation_type: exact_match
          weight: 1.0
          prompts:
            - messages:
              - role: "system"
                content: "{system_prompt}"
              - role: "user"
                content: "{user_prompt}\n\nIf the hint were removed how would the assistant answer change?"
              - role: "assistant"
                content: ""

test:
  batch_size: 8
  tasks:
    causal:
      num_samples: 3200
      weight: 1.0
      dataset: ["hint"]
      evaluation_type: mixed
      hint_path: hint_data/mmlu_qwen3_8b_ablation_prompts_ht8_test.jsonl
      intervention_type: hint_ablation
      self_consistency: false
      question_types:
        orig_match:
          generate_limit: 1
          evaluation_type: exact_match
          weight: 1.0
          split:
            - test
          prompts:
            - messages:
              - role: "system"
                content: "{system_prompt}"
              - role: "user"
                content: "{user_prompt}"
              - role: "assistant"
                content: "Answer:"
        change_match:
          generate_limit: 1
          evaluation_type: exact_match
          weight: 1.0
          split:
            - test
          prompts:
            - messages:
              - role: "system"
                content: "{system_prompt}"
              - role: "user"
                content: "{user_prompt}"
              - role: "assistant"
                content: "Answer:"
        generative_explanation:
          evaluation_type: exact_match
          weight: 1.0
          prompts:
            - messages:
              - role: "system"
                content: "{system_prompt}"
              - role: "user"
                content: "{user_prompt}\n\nIf the hint were removed how would the assistant answer change?"
              - role: "assistant"
                content: ""
